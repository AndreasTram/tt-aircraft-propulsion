<!DOCTYPE html><html><head><meta charset="utf-8"><title>Ideal Gas Calculator</title><link rel="stylesheet" href="../style.css"></head><body><h1>Ideal Gas Calculator</h1><label>Pressure [Pa]<input id="p" type="number" value="101325"></label><br><label>Temperature (K)<input id="T" type="number" value="293.15"></label><br><label>R [J/kgK]<input id="R" type="number" value="287.05"></label><br><button onclick="calc()">Calculate</button><p id="out"></p><script>function calc(){let p=+document.getElementById('p').value;let T=+document.getElementById('T').value;let R=+document.getElementById('R').value;document.getElementById('out').innerText='Density = '+(p/(R*T)).toFixed(4)+' kg/m³';}</script></body></html>
